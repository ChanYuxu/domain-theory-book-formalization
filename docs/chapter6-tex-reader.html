<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chapter 6 PDF.js to Lean</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #d9e0ea;
      --accent: #0f766e;
      --accent-soft: #dff4ef;
      --code-bg: #101827;
      --code-line: #1f2937;
      --code-ink: #e7edf5;
      --warn-bg: #fff7ed;
      --warn-line: #fed7aa;
    }

    * { box-sizing: border-box; }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 14px 18px;
      display: grid;
      grid-template-columns: minmax(280px, 1fr) auto;
      gap: 16px;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
    }

    .meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .search {
      width: min(360px, 34vw);
      min-width: 220px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      font-size: 14px;
      background: #fff;
    }

    .button {
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 0 11px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    main {
      --split-left: 58%;
      min-height: 0;
      display: grid;
      grid-template-columns: var(--split-left) 8px minmax(320px, 1fr);
      overflow: hidden;
    }

    main.resizing {
      user-select: none;
      cursor: col-resize;
    }

    .pdf-pane,
    .lean-pane {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .pdf-pane {
      display: grid;
      grid-template-rows: minmax(0, 1fr) 176px;
      background: #e8edf4;
    }

    .pdf-scroll {
      min-height: 0;
      overflow: auto;
      padding: 18px;
    }

    .pdf-page {
      position: relative;
      flex: none;
      margin: 0 auto 18px;
      background: white;
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.16);
    }

    .pdf-page canvas {
      display: block;
    }

    .pdf-link {
      position: absolute;
      border: 2px solid transparent;
      border-radius: 3px;
      background: rgba(15, 118, 110, 0.06);
      cursor: pointer;
      padding: 0;
    }

    .pdf-link:hover,
    .pdf-link.active {
      border-color: var(--accent);
      background: rgba(15, 118, 110, 0.18);
    }


    .splitter {
      min-width: 8px;
      border: 0;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      background: linear-gradient(90deg, #edf2f7, #f8fafc);
      cursor: col-resize;
      padding: 0;
      position: relative;
    }

    .splitter::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 2px;
      height: 42px;
      border-radius: 999px;
      background: #a8b3c2;
      transform: translate(-50%, -50%);
    }

    .splitter:hover,
    .splitter:focus-visible,
    main.resizing .splitter {
      background: var(--accent-soft);
      outline: none;
    }

    main.resizing .pdf-scroll,
    main.resizing .lean-pane {
      pointer-events: none;
    }

    .marker-panel {
      border-top: 1px solid var(--line);
      background: var(--panel);
      overflow: auto;
      padding: 10px;
    }

    .marker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 8px;
    }

    .marker {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      padding: 8px 9px;
      text-align: left;
      cursor: pointer;
    }

    .marker:hover,
    .marker:focus-visible {
      border-color: #99bdb7;
      outline: none;
    }

    .marker.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .marker-number {
      font-weight: 800;
      font-size: 13px;
    }

    .marker-title {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lean-pane {
      background: var(--panel);
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .code-header {
      border-bottom: 1px solid var(--line);
      padding: 15px 18px;
      display: grid;
      gap: 8px;
    }

    .code-title-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .code-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
    }

    .code-location {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      flex: none;
    }

    .code-summary {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .code-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .code-tag {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 7px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      color: #334155;
      background: #fff;
    }

    pre {
      margin: 0;
      min-height: 0;
      height: 100%;
      overflow: auto;
      background: var(--code-bg);
      color: var(--code-ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.55;
      tab-size: 2;
    }

    .code-line {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      min-width: max-content;
    }

    .line-no {
      color: #94a3b8;
      background: var(--code-line);
      text-align: right;
      padding: 0 12px;
      border-right: 1px solid #334155;
      user-select: none;
    }

    .line-src {
      padding: 0 14px;
      white-space: pre;
    }

    .status,
    .notice {
      padding: 18px;
      color: var(--muted);
    }

    .notice {
      border: 1px solid var(--warn-line);
      background: var(--warn-bg);
      color: #7c2d12;
      margin: 10px;
      border-radius: 8px;
    }

    @media (max-width: 980px) {
      header { grid-template-columns: 1fr; }
      .toolbar { justify-content: flex-start; }
      main {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(560px, 58vh) minmax(360px, 42vh);
      }
      .splitter {
        display: none;
      }
      .pdf-pane {
        border-bottom: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Chapter 6 PDF.js to Lean</h1>
        <div class="meta" id="meta">Loading PDF.js reader...</div>
      </div>
      <div class="toolbar">
        <input class="search" id="search" type="search" placeholder="Search number, title, or Lean name">
        <a class="button" href="generated/chapter6-marked.pdf">Marked PDF</a>
      </div>
    </header>
    <main>
      <section class="pdf-pane" aria-label="PDF.js rendered TeX PDF">
        <div class="pdf-scroll" id="pdfScroll"></div>
        <div class="marker-panel">
          <div class="marker-grid" id="markerGrid"></div>
        </div>
      </section>
      <button class="splitter" id="splitter" type="button" aria-label="Resize PDF and Lean panes"></button>
      <section class="lean-pane" aria-label="Lean source">
        <div class="code-header">
          <div class="code-title-row">
            <h2 class="code-title" id="codeTitle">Select a Lean marker</h2>
            <div class="code-location" id="codeLocation"></div>
          </div>
          <p class="code-summary" id="codeSummary">Click a Lean marker in the rendered PDF, or select an item below the PDF.</p>
          <div class="code-tags" id="codeTags"></div>
        </div>
        <pre id="codeBlock"><div class="status">No Lean item selected.</div></pre>
      </section>
    </main>
  </div>
  <script type="module">
    import * as pdfjsLib from "./vendor/pdfjs/pdf.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc = "./vendor/pdfjs/pdf.worker.mjs";

    const PDF_URL = "generated/chapter6-marked.pdf";
    const MAX_RENDER_SCALE = 1.35;

    const state = {
      map: null,
      extract: null,
      sourceCache: new Map(),
      pdf: null,
      selectedId: "",
      query: "",
      linkById: new Map(),
      resizeTimer: 0,
      splitRenderTimer: 0,
      draggingSplitter: false
    };

    const meta = document.getElementById("meta");
    const appMain = document.querySelector("main");
    const splitter = document.getElementById("splitter");
    const pdfScroll = document.getElementById("pdfScroll");
    const markerGrid = document.getElementById("markerGrid");
    const search = document.getElementById("search");
    const codeTitle = document.getElementById("codeTitle");
    const codeLocation = document.getElementById("codeLocation");
    const codeSummary = document.getElementById("codeSummary");
    const codeTags = document.getElementById("codeTags");
    const codeBlock = document.getElementById("codeBlock");

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function itemById(id) {
      return state.map.items.find(item => item.id === id);
    }

    function detectedIds() {
      const ids = new Set();
      for (const page of state.extract.pages) {
        for (const block of page.blocks) {
          if (block.marker) ids.add(block.marker.id);
        }
      }
      return ids;
    }

    function normalizeDest(dest) {
      if (typeof dest === "string") return dest;
      if (Array.isArray(dest) && typeof dest[0] === "string") return dest[0];
      return "";
    }

    function rectToViewport(rect, viewport) {
      const converted = viewport.convertToViewportRectangle(rect);
      const left = Math.min(converted[0], converted[2]);
      const top = Math.min(converted[1], converted[3]);
      const width = Math.abs(converted[2] - converted[0]);
      const height = Math.abs(converted[3] - converted[1]);
      return { left, top, width, height };
    }

    function contentWidth(element) {
      const style = getComputedStyle(element);
      return element.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
    }

    function fittedViewport(page) {
      const base = page.getViewport({ scale: 1 });
      const fitScale = contentWidth(pdfScroll) / base.width;
      return page.getViewport({ scale: Math.min(MAX_RENDER_SCALE, fitScale) });
    }


    function splitStorageKey() {
      return `domain-reader-split:${PDF_URL}`;
    }

    function applySplitPercent(percent) {
      const clamped = Math.min(76, Math.max(32, percent));
      appMain.style.setProperty("--split-left", `${clamped}%`);
      return clamped;
    }

    function loadSplitPercent() {
      const saved = Number(localStorage.getItem(splitStorageKey()));
      if (Number.isFinite(saved)) applySplitPercent(saved);
    }

    function rerenderPdfSoon(delay = 160) {
      if (!state.pdf) return;
      clearTimeout(state.splitRenderTimer);
      state.splitRenderTimer = setTimeout(async () => {
        await renderPdf();
        if (state.selectedId) {
          highlightSelection(state.selectedId);
          const target = state.linkById.get(state.selectedId);
          if (target) target.pageEl.scrollIntoView({ block: "center" });
        }
      }, delay);
    }

    function updateSplitFromPointer(event) {
      const bounds = appMain.getBoundingClientRect();
      const percent = ((event.clientX - bounds.left) / bounds.width) * 100;
      const clamped = applySplitPercent(percent);
      localStorage.setItem(splitStorageKey(), String(clamped));
    }

    function setupSplitter() {
      loadSplitPercent();
      splitter.addEventListener("pointerdown", event => {
        if (window.matchMedia("(max-width: 980px)").matches) return;
        state.draggingSplitter = true;
        splitter.setPointerCapture(event.pointerId);
        appMain.classList.add("resizing");
        updateSplitFromPointer(event);
      });
      splitter.addEventListener("pointermove", event => {
        if (!state.draggingSplitter) return;
        updateSplitFromPointer(event);
        rerenderPdfSoon(220);
      });
      function finishDrag(event) {
        if (!state.draggingSplitter) return;
        state.draggingSplitter = false;
        if (splitter.hasPointerCapture(event.pointerId)) splitter.releasePointerCapture(event.pointerId);
        appMain.classList.remove("resizing");
        updateSplitFromPointer(event);
        rerenderPdfSoon(0);
      }
      splitter.addEventListener("pointerup", finishDrag);
      splitter.addEventListener("pointercancel", finishDrag);
      splitter.addEventListener("mousedown", event => {
        if (window.matchMedia("(max-width: 980px)").matches) return;
        state.draggingSplitter = true;
        appMain.classList.add("resizing");
        updateSplitFromPointer(event);
        event.preventDefault();
      });
      document.addEventListener("mousemove", event => {
        if (!state.draggingSplitter) return;
        updateSplitFromPointer(event);
        rerenderPdfSoon(220);
      });
      document.addEventListener("mouseup", event => {
        if (!state.draggingSplitter) return;
        state.draggingSplitter = false;
        appMain.classList.remove("resizing");
        updateSplitFromPointer(event);
        rerenderPdfSoon(0);
      });
      splitter.addEventListener("keydown", event => {
        if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
        event.preventDefault();
        const current = Number.parseFloat(getComputedStyle(appMain).getPropertyValue("--split-left")) || 58;
        const next = event.key === 'Home' ? 38 : event.key === 'End' ? 72 : current + (event.key === 'ArrowLeft' ? -3 : 3);
        const clamped = applySplitPercent(next);
        localStorage.setItem(splitStorageKey(), String(clamped));
        rerenderPdfSoon(0);
      });
    }

    async function renderPdf() {
      pdfScroll.innerHTML = "";
      state.linkById.clear();
      state.pdf = await pdfjsLib.getDocument(PDF_URL).promise;
      for (let pageNumber = 1; pageNumber <= state.pdf.numPages; pageNumber += 1) {
        const page = await state.pdf.getPage(pageNumber);
        const viewport = fittedViewport(page);
        const pageEl = document.createElement("div");
        pageEl.className = "pdf-page";
        pageEl.dataset.page = String(pageNumber);
        pageEl.style.width = `${viewport.width}px`;
        pageEl.style.height = `${viewport.height}px`;

        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d");
        canvas.width = Math.floor(viewport.width);
        canvas.height = Math.floor(viewport.height);
        canvas.style.width = `${viewport.width}px`;
        canvas.style.height = `${viewport.height}px`;
        pageEl.appendChild(canvas);
        pdfScroll.appendChild(pageEl);

        await page.render({ canvasContext: context, viewport }).promise;

        const annotations = await page.getAnnotations({ intent: "display" });
        for (const annotation of annotations) {
          const id = normalizeDest(annotation.dest);
          if (!id || !itemById(id) || !annotation.rect) continue;
          const box = rectToViewport(annotation.rect, viewport);
          const link = document.createElement("button");
          link.type = "button";
          link.className = "pdf-link";
          link.dataset.id = id;
          link.title = `Show Lean for ${itemById(id).number}`;
          link.style.left = `${box.left}px`;
          link.style.top = `${box.top}px`;
          link.style.width = `${Math.max(24, box.width)}px`;
          link.style.height = `${Math.max(16, box.height)}px`;
          link.addEventListener("click", event => {
            event.preventDefault();
            event.stopPropagation();
            selectItem(id, true, false);
          });
          pageEl.appendChild(link);
          state.linkById.set(id, { pageEl, link });
        }
      }
    }

    function renderMarkers() {
      const ids = detectedIds();
      const query = state.query.trim().toLowerCase();
      const items = state.map.items.filter(item => {
        if (!ids.has(item.id)) return false;
        const haystack = [item.number, item.kind, item.title, item.summary, ...(item.lean || [])].join(" ").toLowerCase();
        return !query || haystack.includes(query);
      });
      if (!items.length) {
        markerGrid.innerHTML = '<div class="notice">No matching Lean markers.</div>';
        return;
      }
      markerGrid.innerHTML = items.map(item => `
        <button type="button" class="marker ${item.id === state.selectedId ? "active" : ""}" data-id="${escapeHtml(item.id)}">
          <div class="marker-number">${escapeHtml(item.number)}</div>
          <div class="marker-title">${escapeHtml(item.title)}</div>
        </button>
      `).join("");
    }

    async function sourceLinesFor(item) {
      const sourcePath = item.leanFile || state.map.leanFile;
      if (!state.sourceCache.has(sourcePath)) {
        const response = await fetch(sourcePath, { cache: "no-store" });
        if (!response.ok) throw new Error(`Unable to load Lean source ${sourcePath}: ${response.status}`);
        state.sourceCache.set(sourcePath, (await response.text()).split(/\r?\n/));
      }
      return state.sourceCache.get(sourcePath);
    }

    async function renderCode(item) {
      if (!item) {
        codeTitle.textContent = "Select a Lean marker";
        codeLocation.textContent = "";
        codeSummary.textContent = "Click a Lean marker in the rendered PDF, or select an item below the PDF.";
        codeTags.innerHTML = "";
        codeBlock.innerHTML = '<div class="status">No Lean item selected.</div>';
        return;
      }
      codeTitle.textContent = `${item.number}: ${item.title}`;
      const sourcePath = item.leanFile || state.map.leanFile;
      const sourceName = sourcePath.split("/").pop();
      codeLocation.textContent = `${sourceName}:${item.startLine}-${item.endLine}`;
      codeSummary.textContent = item.summary;
      codeTags.innerHTML = (item.lean || []).map(name => `<span class="code-tag">${escapeHtml(name)}</span>`).join("");
      const sourceLines = await sourceLinesFor(item);
      const start = Math.max(1, item.startLine);
      const end = Math.min(sourceLines.length, item.endLine);
      const rows = [];
      for (let line = start; line <= end; line += 1) {
        rows.push(`<div class="code-line"><span class="line-no">${line}</span><span class="line-src">${escapeHtml(sourceLines[line - 1] || "")}</span></div>`);
      }
      codeBlock.innerHTML = rows.join("");
    }

    function highlightSelection(id) {
      document.querySelectorAll(".pdf-link.active, .marker.active").forEach(el => el.classList.remove("active"));
      document.querySelectorAll(`.pdf-link[data-id="${CSS.escape(id)}"], .marker[data-id="${CSS.escape(id)}"]`).forEach(el => el.classList.add("active"));
    }

    async function selectItem(id, updateHash = true, scrollPdf = true) {
      const item = itemById(id);
      if (!item) return;
      state.selectedId = id;
      renderMarkers();
      await renderCode(item);
      highlightSelection(id);
      const target = state.linkById.get(id);
      if (scrollPdf && target) {
        target.pageEl.scrollIntoView({ block: "center" });
      }
      const active = document.querySelector(`.marker[data-id="${CSS.escape(id)}"]`);
      if (active) active.scrollIntoView({ block: "nearest" });
      if (updateHash) history.replaceState(null, "", `#${id}`);
    }

    async function load() {
      try {
        if (location.protocol === "file:") {
          throw new Error("Open this through the local server, not by double-clicking the HTML file.");
        }
        const [mapResponse, extractResponse] = await Promise.all([
          fetch("chapter6-map.json", { cache: "no-store" }),
          fetch("generated/chapter6-extract.json", { cache: "no-store" })
        ]);
        if (!mapResponse.ok) throw new Error(`Unable to load map: ${mapResponse.status}`);
        if (!extractResponse.ok) throw new Error(`Unable to load generated/chapter6-extract.json: ${extractResponse.status}`);
        state.map = await mapResponse.json();
        state.extract = await extractResponse.json();
        renderMarkers();
        await renderPdf();
        meta.textContent = `${state.extract.markerCount} clickable PDF markers · PDF.js rendered`;
        const hashId = decodeURIComponent(location.hash.replace(/^#/, ""));
        if (hashId) await selectItem(hashId, false, true);
      } catch (error) {
        meta.textContent = "PDF.js reader failed to load";
        pdfScroll.innerHTML = `
          <div class="notice">
            Run this from the repository root, then refresh:<br>
            <code>python3 docs/build_chapter6_extract.py "/absolute/path/to/Domain Theory.pdf"</code>
          </div>
        `;
        codeTitle.textContent = "Generated files required";
        codeSummary.textContent = error.message;
        codeBlock.innerHTML = `<div class="status">${escapeHtml(error.message)}</div>`;
      }
    }

    markerGrid.addEventListener("click", event => {
      const button = event.target.closest(".marker");
      if (button) selectItem(button.dataset.id, true, true);
    });

    search.addEventListener("input", event => {
      state.query = event.target.value;
      if (state.map && state.extract) {
        renderMarkers();
        if (state.selectedId) highlightSelection(state.selectedId);
      }
    });

    window.addEventListener("hashchange", () => {
      const id = decodeURIComponent(location.hash.replace(/^#/, ""));
      if (id) selectItem(id, false, true);
    });

    window.addEventListener("resize", () => {
      if (!state.pdf) return;
      clearTimeout(state.resizeTimer);
      state.resizeTimer = setTimeout(async () => {
        await renderPdf();
        if (state.selectedId) {
          highlightSelection(state.selectedId);
          const target = state.linkById.get(state.selectedId);
          if (target) target.pageEl.scrollIntoView({ block: "center" });
        }
      }, 180);
    });

    setupSplitter();
    load();
  </script>
</body>
</html>
